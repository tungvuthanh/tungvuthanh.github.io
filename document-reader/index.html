<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Document reader</title><link rel="stylesheet" href="reader.css"></head><body>
<header><a class="brand" href="#" id="home">DOCUMENT READER</a><span id="version"></span><button id="print">Print / save PDF</button></header>
<div class="shell"><aside><div class="eyebrow">REVIEW WORKSPACE</div><h1 id="title">Opening document…</h1><p id="date"></p><nav id="tabs" aria-label="Reader views"><button data-view="overview" class="active">Overview</button><button data-view="report">Full report</button><button data-view="evidence">Original evidence</button><button data-view="references">References</button></nav><label for="search">Find in this dossier</label><input id="search" type="search" placeholder="Track, date, evidence or phrase"><p id="search-status" role="status"></p><div id="toc"></div><p class="side-note">Source links open the original documents. Account screenshots preserve the figures shown on their capture dates.</p></aside>
<main id="main"><div class="loading" role="status">Loading the shared document…</div></main></div>
<dialog id="viewer"><div class="dialogbar"><strong id="viewer-title"></strong><button id="close-viewer">Close ✕</button></div><div id="viewer-body"></div></dialog><div id="notice" role="status"></div><script src="reader.js"></script></body></html>
